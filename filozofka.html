<script>
function generujNahodnouHlashku() {
  const postavy = [
    { jmeno: "🔥 Režim CHAOS", funkce: generujChaos },
    { jmeno: "🎤 AI Básník", funkce: generujBasen },
    { jmeno: "🧙 Filozofka Izy", funkce: generujFilozofku },
    { jmeno: "🤖 Systémová Izy", funkce: generujSystem },
    { jmeno: "🦆 Kachna s korunou", funkce: generujKachnu },
    { jmeno: "🧛 Upír z noci", funkce: generujVampir },
    { jmeno: "🧞‍♂️ Džin AI", funkce: generujDzin }
  ];

  const nahodna = postavy[Math.floor(Math.random() * postavy.length)];
  const hlaska = nahodna.funkce();

  document.getElementById("output").innerHTML = `
    <div class='postava'>${nahodna.jmeno}</div>
    <div id="animovanyText"></div>
  `;

  vypisPoPismenkach(hlaska, "animovanyText", 35);
  nahodnyStyl();
}

function vypisPoPismenkach(text, elementId, delay = 35) {
  const element = document.getElementById(elementId);
  element.innerHTML = "";
  let i = 0;

  function napisDal() {
    if (i < text.length) {
      element.innerHTML += text.charAt(i);
      i++;
      setTimeout(napisDal, delay);
    }
  }

  napisDal();
}

function prehrajZvuk() {
  const zvuk = document.getElementById("zvukKlik");
  if (zvuk) {
    zvuk.currentTime = 0;
    zvuk.play();
  }
}

</script>
